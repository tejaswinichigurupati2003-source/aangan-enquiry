<text x="830" y="35" fill="#fff" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="1.5">AANGAN STUDIO · PHONE ENQUIRY SYSTEM · COMPONENTS MAP</text><text x="358" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">TRIGGER</text><circle cx="358" cy="128" r="4" fill="#12b886"/><text x="634" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">INPUT</text><circle cx="634" cy="128" r="4" fill="#12b886"/><text x="910" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">CONTEXT</text><circle cx="910" cy="128" r="4" fill="#12b886"/><text x="1186" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">PROCESSING</text><circle cx="1186" cy="128" r="4" fill="#12b886"/><text x="1462" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">OUTPUT</text><circle cx="1462" cy="128" r="4" fill="#12b886"/><line x1="0" y1="130" x2="1660" y2="130" stroke="#9ca3af"/><rect x="0" y="130" width="1660" height="150" fill="#ffffff"/><line x1="0" y1="280" x2="1660" y2="280" stroke="#e5e7eb"/><text x="110" y="203" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">CALLER</text><text x="110" y="222" font-size="12" text-anchor="middle" fill="#6b7280">(or a designer on the</text><text x="110" y="237" font-size="12" text-anchor="middle" fill="#6b7280">dashboard)</text><rect x="0" y="280" width="1660" height="150" fill="#f8f8f9"/><line x1="0" y1="430" x2="1660" y2="430" stroke="#e5e7eb"/><text x="110" y="353" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">VANI</text><text x="110" y="372" font-size="12" text-anchor="middle" fill="#6b7280">(voice + phone line)</text><rect x="0" y="430" width="1660" height="150" fill="#ffffff"/><line x1="0" y1="580" x2="1660" y2="580" stroke="#e5e7eb"/><text x="110" y="503" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">AANGAN SERVER</text><text x="110" y="522" font-size="12" text-anchor="middle" fill="#6b7280">(Vercel: webhook + engine)</text><rect x="0" y="580" width="1660" height="150" fill="#f8f8f9"/><line x1="0" y1="730" x2="1660" y2="730" stroke="#e5e7eb"/><text x="110" y="653" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">GEMINI</text><text x="110" y="672" font-size="12" text-anchor="middle" fill="#6b7280">(LLM)</text><rect x="0" y="730" width="1660" height="150" fill="#ffffff"/><line x1="0" y1="880" x2="1660" y2="880" stroke="#e5e7eb"/><text x="110" y="803" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">SUPABASE</text><text x="110" y="822" font-size="12" text-anchor="middle" fill="#6b7280">(Database)</text><rect x="0" y="880" width="1660" height="150" fill="#f8f8f9"/><line x1="0" y1="1030" x2="1660" y2="1030" stroke="#e5e7eb"/><text x="110" y="953" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">STUDIO TOOLS</text><text x="110" y="972" font-size="12" text-anchor="middle" fill="#6b7280">(Telegram · HubSpot ·</text><text x="110" y="987" font-size="12" text-anchor="middle" fill="#6b7280">Calendar · Email)</text><rect x="0" y="1030" width="1660" height="150" fill="#ffffff"/><line x1="0" y1="1180" x2="1660" y2="1180" stroke="#e5e7eb"/><text x="110" y="1103" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">TEAM</text><text x="110" y="1122" font-size="12" text-anchor="middle" fill="#6b7280">(Nikhil · front desk ·</text><text x="110" y="1137" font-size="12" text-anchor="middle" fill="#6b7280">designers)</text><line x1="220" y1="130" x2="220" y2="1180" stroke="#e5e7eb"/><line x1="496" y1="130" x2="496" y2="1180" stroke="#e5e7eb"/><line x1="772" y1="130" x2="772" y2="1180" stroke="#e5e7eb"/><line x1="1048" y1="130" x2="1048" y2="1180" stroke="#e5e7eb"/><line x1="1324" y1="130" x2="1324" y2="1180" stroke="#e5e7eb"/><line x1="1600" y1="130" x2="1600" y2="1180" stroke="#e5e7eb"/><path d="M480,200 L496,200 L496,350 L512,350" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M788,350 L756,350" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M604,398 L604,416 L1156,416 L1156,398" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1216,398 L1216,436 L664,436 L664,452" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M756,500 L788,500" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1032,480 L1064,480" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1146,548 L1146,594" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1226,594 L1226,548" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1308,470 L1336,470 L1336,688 L1308,688" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1308,485 L1326,485 L1326,800 L1340,800" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1308,500 L1322,500 L1322,920 L1340,920" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1308,515 L1318,515 L1318,988 L1340,988" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1584,988 L1616,988 L1616,200 L1584,200" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1584,800 L1634,800 L1634,1100 L1584,1100" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M480,1090 L772,1090 L772,800 L788,800" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1340,1110 L480,1110" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1032,800 L1042,800 L1042,500 L1064,500" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1032,950 L1052,950 L1052,520 L1064,520" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="236" y="152" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="358" y="178" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">CALLER DIALS</text><text x="358" y="199" font-size="12.5" text-anchor="middle" fill="#1f2937">Rings the studio number</text><text x="358" y="215" font-size="12.5" text-anchor="middle" fill="#1f2937">(or Vani dials a call-back)</text><circle cx="240" cy="156" r="11" fill="#17181c"/><text x="240" y="160.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">1</text><rect x="236" y="1052" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="358" y="1078" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">TEAM ACTS</text><text x="358" y="1099" font-size="12.5" text-anchor="middle" fill="#1f2937">Reassign, book, add notes,</text><text x="358" y="1115" font-size="12.5" text-anchor="middle" fill="#1f2937">mark stage (PIN for changes)</text><circle cx="240" cy="1056" r="11" fill="#17181c"/><text x="240" y="1060.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">11</text><rect x="512" y="302" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="634" y="328" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">VANI VOICE AI</text><text x="634" y="349" font-size="12.5" text-anchor="middle" fill="#1f2937">Answers, speaks Hindi/English,</text><text x="634" y="365" font-size="12.5" text-anchor="middle" fill="#1f2937">collects details, reads the time</text><text x="634" y="381" font-size="12.5" text-anchor="middle" fill="#1f2937">back, asks for the e-mail</text><circle cx="516" cy="306" r="11" fill="#17181c"/><text x="516" y="310.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">2</text><rect x="788" y="302" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="910" y="328" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">AGENT PROMPT + GUARDRAILS</text><text x="910" y="349" font-size="12.5" text-anchor="middle" fill="#1f2937">No prices · never claims human</text><text x="910" y="365" font-size="12.5" text-anchor="middle" fill="#1f2937">no referrals · complaints go to</text><text x="910" y="381" font-size="12.5" text-anchor="middle" fill="#1f2937">Nikhil · greeting says "AI"</text><rect x="1064" y="302" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="1186" y="328" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">VANI · AFTER THE CALL</text><text x="1186" y="349" font-size="12.5" text-anchor="middle" fill="#1f2937">Sends the webhook:</text><text x="1186" y="365" font-size="12.5" text-anchor="middle" fill="#1f2937">call ended + transcript ready</text><circle cx="1068" cy="306" r="11" fill="#17181c"/><text x="1068" y="310.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">3</text><rect x="512" y="452" width="244" height="96" rx="11" fill="#eef0ff" stroke="#5b52c9" stroke-width="2"/><text x="634" y="478" font-size="11" font-weight="700" text-anchor="middle" fill="#4a40b0" letter-spacing="1">WEBHOOK RECEIVER</text><text x="634" y="499" font-size="12.5" text-anchor="middle" fill="#1f2937">Checks the secret in the URL,</text><text x="634" y="515" font-size="12.5" text-anchor="middle" fill="#1f2937">ignores repeats, re-fetches the</text><text x="634" y="531" font-size="12.5" text-anchor="middle" fill="#1f2937">transcript from Vani itself</text><circle cx="516" cy="456" r="11" fill="#17181c"/><text x="516" y="460.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">4</text><rect x="788" y="452" width="244" height="96" rx="11" fill="#eef0ff" stroke="#5b52c9" stroke-width="2"/><text x="910" y="478" font-size="11" font-weight="700" text-anchor="middle" fill="#4a40b0" letter-spacing="1">RULES (CODE, NOT MODEL)</text><text x="910" y="499" font-size="12.5" text-anchor="middle" fill="#1f2937">Green / Amber / Red / Escalate</text><text x="910" y="515" font-size="12.5" text-anchor="middle" fill="#1f2937">from qualified.md; AI never</text><text x="910" y="531" font-size="12.5" text-anchor="middle" fill="#1f2937">decides policy or price</text><rect x="1064" y="452" width="244" height="96" rx="11" fill="#eef0ff" stroke="#5b52c9" stroke-width="2"/><text x="1186" y="478" font-size="11" font-weight="700" text-anchor="middle" fill="#4a40b0" letter-spacing="1">AANGAN ENGINE</text><text x="1186" y="499" font-size="12.5" text-anchor="middle" fill="#1f2937">Decides tier · assigns designer</text><text x="1186" y="515" font-size="12.5" text-anchor="middle" fill="#1f2937">books the slot only if free</text><text x="1186" y="531" font-size="12.5" text-anchor="middle" fill="#1f2937">routes to every channel</text><circle cx="1068" cy="456" r="11" fill="#17181c"/><text x="1068" y="460.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">7</text><rect x="1064" y="594" width="244" height="52" rx="11" fill="#fffaf0" stroke="#e0922b" stroke-width="2"/><text x="1186" y="611" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b8700f" letter-spacing="1">GEMINI · READS THE CALL</text><text x="1186" y="626" font-size="11.5" text-anchor="middle" fill="#1f2937">Facts + verdicts (code decides tier)</text><circle cx="1068" cy="598" r="11" fill="#17181c"/><text x="1068" y="602.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">5</text><rect x="1064" y="662" width="244" height="52" rx="11" fill="#fffaf0" stroke="#e0922b" stroke-width="2"/><text x="1186" y="679" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b8700f" letter-spacing="1">GEMINI · BOOKING REQUEST</text><text x="1186" y="694" font-size="11.5" text-anchor="middle" fill="#1f2937">Day, time, e-mail (caller's last word)</text><circle cx="1068" cy="666" r="11" fill="#17181c"/><text x="1068" y="670.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">6</text><rect x="788" y="752" width="244" height="96" rx="11" fill="#ecfbf3" stroke="#1f9d6e" stroke-width="2"/><text x="910" y="778" font-size="11" font-weight="700" text-anchor="middle" fill="#13805a" letter-spacing="1">SUPABASE</text><text x="910" y="799" font-size="12.5" text-anchor="middle" fill="#1f2937">Calls, leads, owners, stages,</text><text x="910" y="815" font-size="12.5" text-anchor="middle" fill="#1f2937">consultations, audit log</text><rect x="1340" y="752" width="244" height="96" rx="11" fill="#ecfbf3" stroke="#1f9d6e" stroke-width="2"/><text x="1462" y="778" font-size="11" font-weight="700" text-anchor="middle" fill="#13805a" letter-spacing="1">SUPABASE</text><text x="1462" y="799" font-size="12.5" text-anchor="middle" fill="#1f2937">Saves the lead, booking,</text><text x="1462" y="815" font-size="12.5" text-anchor="middle" fill="#1f2937">notes and every event</text><circle cx="1344" cy="756" r="11" fill="#17181c"/><text x="1344" y="760.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">8</text><rect x="788" y="902" width="244" height="96" rx="11" fill="#f5eeff" stroke="#8a52d6" stroke-width="2"/><text x="910" y="928" font-size="11" font-weight="700" text-anchor="middle" fill="#6c36b8" letter-spacing="1">STUDIO CALENDAR (iCAL)</text><text x="910" y="949" font-size="12.5" text-anchor="middle" fill="#1f2937">Read-only: busy times the AI</text><text x="910" y="965" font-size="12.5" text-anchor="middle" fill="#1f2937">must never offer or book over</text><rect x="1340" y="894" width="244" height="52" rx="11" fill="#f5eeff" stroke="#8a52d6" stroke-width="2"/><text x="1462" y="911" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6c36b8" letter-spacing="1">TELEGRAM · HUBSPOT</text><text x="1462" y="926" font-size="11.5" text-anchor="middle" fill="#1f2937">Note + full transcript to designers</text><text x="1462" y="942" font-size="11.5" text-anchor="middle" fill="#1f2937">Contact + deal in "Aangan Enquiries"</text><circle cx="1344" cy="898" r="11" fill="#17181c"/><text x="1344" y="902.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">9</text><rect x="1340" y="962" width="244" height="52" rx="11" fill="#f5eeff" stroke="#8a52d6" stroke-width="2"/><text x="1462" y="979" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6c36b8" letter-spacing="1">CALENDAR · E-MAIL</text><text x="1462" y="994" font-size="11.5" text-anchor="middle" fill="#1f2937">Event blocks the slot · caller gets</text><text x="1462" y="1010" font-size="11.5" text-anchor="middle" fill="#1f2937">a confirmation + invite</text><circle cx="1344" cy="966" r="11" fill="#17181c"/><text x="1344" y="970.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">10</text><rect x="1340" y="152" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="1462" y="178" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">CALLER RECEIVES</text><text x="1462" y="199" font-size="12.5" text-anchor="middle" fill="#1f2937">Confirmation e-mail with the</text><text x="1462" y="215" font-size="12.5" text-anchor="middle" fill="#1f2937">booked time and calendar invite</text><rect x="1340" y="1052" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="1462" y="1078" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">DASHBOARD</text><text x="1462" y="1099" font-size="12.5" text-anchor="middle" fill="#1f2937">Leads, chat transcript, schedule,</text><text x="1462" y="1115" font-size="12.5" text-anchor="middle" fill="#1f2937">workload, "needs attention", reassign</text><line x1="0" y1="1180" x2="1660" y2="1180" stroke="#9ca3af"/><text x="30" y="1210" font-size="13" fill="#374151" font-weight="700">Flow: 1 call → 2 Vani talks → 3 webhook → 4 verify + fetch transcript → 5 Gemini classifies → 6 Gemini reads the booking request → 7 engine decides + books → 8 saved → 9 Telegram / HubSpot → 10 calendar + caller e-mail → 11 team works the lead</text><text x="30" y="1234" font-size="12.5" fill="#6b7280">Dry-run until credentials exist: Google Calendar write (service account) and caller e-mail (Resend domain verification). Test and seed data never reach Telegram, HubSpot or e-mail.</text><text x="30" y="1254" font-size="12.5" fill="#6b7280">Live dashboard: https://aangan-dashboard-gamma.vercel.app   ·   Webhook: /webhooks/vaani/&lt;secret&gt;   ·   An always-on call server (optional) would let the AI confirm a slot DURING the call.</text></svg>
