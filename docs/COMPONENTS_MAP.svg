<text x="800" y="35" fill="#fff" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="1.5">AANGAN STUDIO · PHONE ENQUIRY SYSTEM · COMPONENTS MAP</text><text x="358" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">TRIGGER</text><circle cx="358" cy="128" r="4" fill="#12b886"/><text x="634" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">INPUT</text><circle cx="634" cy="128" r="4" fill="#12b886"/><text x="910" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">CONTEXT</text><circle cx="910" cy="128" r="4" fill="#12b886"/><text x="1186" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">PROCESSING</text><circle cx="1186" cy="128" r="4" fill="#12b886"/><text x="1462" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#17181c">OUTPUT</text><circle cx="1462" cy="128" r="4" fill="#12b886"/><line x1="0" y1="130" x2="1600" y2="130" stroke="#9ca3af"/><rect x="0" y="130" width="1600" height="132" fill="#ffffff"/><line x1="0" y1="262" x2="1600" y2="262" stroke="#e5e7eb"/><text x="110" y="194" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">CALLER</text><text x="110" y="213" font-size="12" text-anchor="middle" fill="#6b7280">(or a designer on the</text><text x="110" y="228" font-size="12" text-anchor="middle" fill="#6b7280">dashboard)</text><rect x="0" y="262" width="1600" height="132" fill="#f8f8f9"/><line x1="0" y1="394" x2="1600" y2="394" stroke="#e5e7eb"/><text x="110" y="326" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">VANI</text><text x="110" y="345" font-size="12" text-anchor="middle" fill="#6b7280">(voice + phone line)</text><rect x="0" y="394" width="1600" height="132" fill="#ffffff"/><line x1="0" y1="526" x2="1600" y2="526" stroke="#e5e7eb"/><text x="110" y="458" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">AANGAN SERVER</text><text x="110" y="477" font-size="12" text-anchor="middle" fill="#6b7280">(Vercel: webhook + engine)</text><rect x="0" y="526" width="1600" height="132" fill="#f8f8f9"/><line x1="0" y1="658" x2="1600" y2="658" stroke="#e5e7eb"/><text x="110" y="590" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">GEMINI</text><text x="110" y="609" font-size="12" text-anchor="middle" fill="#6b7280">(LLM)</text><rect x="0" y="658" width="1600" height="132" fill="#ffffff"/><line x1="0" y1="790" x2="1600" y2="790" stroke="#e5e7eb"/><text x="110" y="722" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">SUPABASE</text><text x="110" y="741" font-size="12" text-anchor="middle" fill="#6b7280">(Database)</text><rect x="0" y="790" width="1600" height="132" fill="#f8f8f9"/><line x1="0" y1="922" x2="1600" y2="922" stroke="#e5e7eb"/><text x="110" y="854" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">STUDIO TOOLS</text><text x="110" y="873" font-size="12" text-anchor="middle" fill="#6b7280">(Telegram · HubSpot ·</text><text x="110" y="888" font-size="12" text-anchor="middle" fill="#6b7280">Calendar · Email)</text><rect x="0" y="922" width="1600" height="132" fill="#ffffff"/><line x1="0" y1="1054" x2="1600" y2="1054" stroke="#e5e7eb"/><text x="110" y="986" font-size="15" font-weight="700" text-anchor="middle" fill="#17181c">TEAM</text><text x="110" y="1005" font-size="12" text-anchor="middle" fill="#6b7280">(Nikhil · front desk ·</text><text x="110" y="1020" font-size="12" text-anchor="middle" fill="#6b7280">designers)</text><line x1="220" y1="130" x2="220" y2="1054" stroke="#e5e7eb"/><line x1="496" y1="130" x2="496" y2="1054" stroke="#e5e7eb"/><line x1="772" y1="130" x2="772" y2="1054" stroke="#e5e7eb"/><line x1="1048" y1="130" x2="1048" y2="1054" stroke="#e5e7eb"/><line x1="1324" y1="130" x2="1324" y2="1054" stroke="#e5e7eb"/><line x1="1600" y1="130" x2="1600" y2="1054" stroke="#e5e7eb"/><rect x="236" y="148" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="358" y="174" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">CALLER DIALS</text><text x="358" y="195" font-size="12.5" text-anchor="middle" fill="#1f2937">Rings the studio number</text><text x="358" y="211" font-size="12.5" text-anchor="middle" fill="#1f2937">(or Vani dials a call-back)</text><circle cx="240" cy="152" r="11" fill="#17181c"/><text x="240" y="156.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">1</text><rect x="236" y="940" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="358" y="966" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">TEAM ACTS</text><text x="358" y="987" font-size="12.5" text-anchor="middle" fill="#1f2937">Reassign, book, add notes,</text><text x="358" y="1003" font-size="12.5" text-anchor="middle" fill="#1f2937">mark stage (PIN for changes)</text><circle cx="240" cy="944" r="11" fill="#17181c"/><text x="240" y="948.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">11</text><rect x="512" y="280" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="634" y="306" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">VANI VOICE AI</text><text x="634" y="327" font-size="12.5" text-anchor="middle" fill="#1f2937">Answers, speaks Hindi/English,</text><text x="634" y="343" font-size="12.5" text-anchor="middle" fill="#1f2937">collects details, reads the time</text><text x="634" y="359" font-size="12.5" text-anchor="middle" fill="#1f2937">back, asks for the e-mail</text><circle cx="516" cy="284" r="11" fill="#17181c"/><text x="516" y="288.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">2</text><rect x="788" y="280" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="910" y="306" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">AGENT PROMPT + GUARDRAILS</text><text x="910" y="327" font-size="12.5" text-anchor="middle" fill="#1f2937">No prices · never claims human</text><text x="910" y="343" font-size="12.5" text-anchor="middle" fill="#1f2937">no referrals · complaints go to</text><text x="910" y="359" font-size="12.5" text-anchor="middle" fill="#1f2937">Nikhil · greeting says "AI"</text><rect x="1064" y="280" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="1186" y="306" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">VANI · AFTER THE CALL</text><text x="1186" y="327" font-size="12.5" text-anchor="middle" fill="#1f2937">Sends the webhook:</text><text x="1186" y="343" font-size="12.5" text-anchor="middle" fill="#1f2937">call ended + transcript ready</text><circle cx="1068" cy="284" r="11" fill="#17181c"/><text x="1068" y="288.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">3</text><rect x="512" y="412" width="244" height="96" rx="11" fill="#eef0ff" stroke="#5b52c9" stroke-width="2"/><text x="634" y="438" font-size="11" font-weight="700" text-anchor="middle" fill="#4a40b0" letter-spacing="1">WEBHOOK RECEIVER</text><text x="634" y="459" font-size="12.5" text-anchor="middle" fill="#1f2937">Checks the secret in the URL,</text><text x="634" y="475" font-size="12.5" text-anchor="middle" fill="#1f2937">ignores repeats, re-fetches the</text><text x="634" y="491" font-size="12.5" text-anchor="middle" fill="#1f2937">transcript from Vani itself</text><circle cx="516" cy="416" r="11" fill="#17181c"/><text x="516" y="420.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">4</text><rect x="788" y="412" width="244" height="96" rx="11" fill="#eef0ff" stroke="#5b52c9" stroke-width="2"/><text x="910" y="438" font-size="11" font-weight="700" text-anchor="middle" fill="#4a40b0" letter-spacing="1">RULES (CODE, NOT MODEL)</text><text x="910" y="459" font-size="12.5" text-anchor="middle" fill="#1f2937">Green / Amber / Red / Escalate</text><text x="910" y="475" font-size="12.5" text-anchor="middle" fill="#1f2937">from qualified.md; AI never</text><text x="910" y="491" font-size="12.5" text-anchor="middle" fill="#1f2937">decides policy or price</text><rect x="1064" y="412" width="244" height="96" rx="11" fill="#eef0ff" stroke="#5b52c9" stroke-width="2"/><text x="1186" y="438" font-size="11" font-weight="700" text-anchor="middle" fill="#4a40b0" letter-spacing="1">AANGAN ENGINE</text><text x="1186" y="459" font-size="12.5" text-anchor="middle" fill="#1f2937">Decides tier · assigns designer</text><text x="1186" y="475" font-size="12.5" text-anchor="middle" fill="#1f2937">books the slot only if free</text><text x="1186" y="491" font-size="12.5" text-anchor="middle" fill="#1f2937">routes to every channel</text><circle cx="1068" cy="416" r="11" fill="#17181c"/><text x="1068" y="420.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">7</text><rect x="1064" y="534" width="244" height="96" rx="11" fill="#fffaf0" stroke="#e0922b" stroke-width="2"/><text x="1186" y="560" font-size="11" font-weight="700" text-anchor="middle" fill="#b8700f" letter-spacing="1">GEMINI · READS THE CALL</text><text x="1186" y="581" font-size="12.5" text-anchor="middle" fill="#1f2937">Facts + verdicts (code decides tier)</text><circle cx="1068" cy="538" r="11" fill="#17181c"/><text x="1068" y="542.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">5</text><rect x="1064" y="596" width="244" height="52" rx="11" fill="#fffaf0" stroke="#e0922b" stroke-width="2"/><text x="1186" y="613" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b8700f" letter-spacing="1">GEMINI · BOOKING REQUEST</text><text x="1186" y="628" font-size="11.5" text-anchor="middle" fill="#1f2937">Day, time, e-mail (caller's last word)</text><circle cx="1068" cy="600" r="11" fill="#17181c"/><text x="1068" y="604.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">6</text><rect x="788" y="676" width="244" height="96" rx="11" fill="#ecfbf3" stroke="#1f9d6e" stroke-width="2"/><text x="910" y="702" font-size="11" font-weight="700" text-anchor="middle" fill="#13805a" letter-spacing="1">SUPABASE</text><text x="910" y="723" font-size="12.5" text-anchor="middle" fill="#1f2937">Calls, leads, owners, stages,</text><text x="910" y="739" font-size="12.5" text-anchor="middle" fill="#1f2937">consultations, audit log</text><rect x="1340" y="676" width="244" height="96" rx="11" fill="#ecfbf3" stroke="#1f9d6e" stroke-width="2"/><text x="1462" y="702" font-size="11" font-weight="700" text-anchor="middle" fill="#13805a" letter-spacing="1">SUPABASE</text><text x="1462" y="723" font-size="12.5" text-anchor="middle" fill="#1f2937">Saves the lead, booking,</text><text x="1462" y="739" font-size="12.5" text-anchor="middle" fill="#1f2937">notes and every event</text><circle cx="1344" cy="680" r="11" fill="#17181c"/><text x="1344" y="684.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">8</text><rect x="788" y="808" width="244" height="96" rx="11" fill="#f5eeff" stroke="#8a52d6" stroke-width="2"/><text x="910" y="834" font-size="11" font-weight="700" text-anchor="middle" fill="#6c36b8" letter-spacing="1">STUDIO CALENDAR (iCAL)</text><text x="910" y="855" font-size="12.5" text-anchor="middle" fill="#1f2937">Read-only: busy times the AI</text><text x="910" y="871" font-size="12.5" text-anchor="middle" fill="#1f2937">must never offer or book over</text><rect x="1340" y="798" width="244" height="96" rx="11" fill="#f5eeff" stroke="#8a52d6" stroke-width="2"/><text x="1462" y="824" font-size="11" font-weight="700" text-anchor="middle" fill="#6c36b8" letter-spacing="1">TELEGRAM · HUBSPOT</text><text x="1462" y="845" font-size="12.5" text-anchor="middle" fill="#1f2937">Note + full transcript to designers</text><text x="1462" y="861" font-size="12.5" text-anchor="middle" fill="#1f2937">Contact + deal in "Aangan Enquiries"</text><circle cx="1344" cy="802" r="11" fill="#17181c"/><text x="1344" y="806.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">9</text><rect x="1340" y="860" width="244" height="52" rx="11" fill="#f5eeff" stroke="#8a52d6" stroke-width="2"/><text x="1462" y="877" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6c36b8" letter-spacing="1">CALENDAR · E-MAIL</text><text x="1462" y="892" font-size="11.5" text-anchor="middle" fill="#1f2937">Event blocks the slot · caller gets</text><text x="1462" y="908" font-size="11.5" text-anchor="middle" fill="#1f2937">a confirmation + invite</text><circle cx="1344" cy="864" r="11" fill="#17181c"/><text x="1344" y="868.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">10</text><rect x="1340" y="148" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="1462" y="174" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">CALLER RECEIVES</text><text x="1462" y="195" font-size="12.5" text-anchor="middle" fill="#1f2937">Confirmation e-mail with the</text><text x="1462" y="211" font-size="12.5" text-anchor="middle" fill="#1f2937">booked time and calendar invite</text><rect x="1340" y="940" width="244" height="96" rx="11" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/><text x="1462" y="966" font-size="11" font-weight="700" text-anchor="middle" fill="#2a56b0" letter-spacing="1">DASHBOARD</text><text x="1462" y="987" font-size="12.5" text-anchor="middle" fill="#1f2937">Leads, chat transcript, schedule,</text><text x="1462" y="1003" font-size="12.5" text-anchor="middle" fill="#1f2937">workload, "needs attention", reassign</text><line x1="0" y1="1054" x2="1600" y2="1054" stroke="#9ca3af"/><text x="30" y="1084" font-size="13" fill="#374151" font-weight="700">Flow: 1 call → 2 Vani talks → 3 webhook → 4 verify + fetch transcript → 5 Gemini classifies → 6 Gemini reads the booking request → 7 engine decides + books → 8 saved → 9 Telegram / HubSpot → 10 calendar + caller e-mail → 11 team works the lead</text><text x="30" y="1108" font-size="12.5" fill="#6b7280">Dry-run until credentials exist: Google Calendar write (service account) and caller e-mail (Resend domain verification). Test and seed data never reach Telegram, HubSpot or e-mail.</text><text x="30" y="1128" font-size="12.5" fill="#6b7280">Live dashboard: https://aangan-dashboard-gamma.vercel.app   ·   Webhook: /webhooks/vaani/&lt;secret&gt;   ·   Always-on call server (optional) lets the AI confirm a slot DURING the call.</text></svg>
