<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aangan Studio — phone enquiries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceefa; --card: #ffffff; --soft: #f4f5fd; --ink: #151833; --ink-2: #4b4f6b; --ink-3: #6a6e8c; --line: #e7e9f5;
    --brand: #4150e8; --brand-2: #6a76f6; --on-brand: #ffffff; --shadow: 0 1px 2px rgba(30,34,90,.04), 0 8px 24px rgba(30,34,90,.06);
    /* tier colours — validated with the dataviz validator (light surface #ffffff, stack order green, escalate, amber, red) */
    --t-green: #008300; --t-escalate: #4a3aa7; --t-amber: #c98500; --t-red: #d03b3b;
    --p-green-bg: #e0f5e4; --p-green: #006300; --p-amber-bg: #fdf0d4; --p-amber: #8a5a00; --p-red-bg: #fde4e4; --p-red: #a82525; --p-esc-bg: #ebe8fa; --p-esc: #4a3aa7; --p-neutral-bg: #eef0f8; --p-neutral: #4b4f6b; --p-blue-bg: #e1ebfb; --p-blue: #1d4f9a;
    --s-blue: #2a78d6; --s-gray: #c4c8e0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12132a; --card: #1e2036; --soft: #262945; --ink: #f0f1fa; --ink-2: #c3c6dd; --ink-3: #9a9ec0; --line: #2f3254;
      --brand: #6b78ff; --brand-2: #8b95ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --t-green: #0ca30c; --t-escalate: #9085e9; --t-amber: #c98500; --t-red: #e34948;
      --p-green-bg: #163a1f; --p-green: #6fd88a; --p-amber-bg: #3d2f0c; --p-amber: #f0b45c; --p-red-bg: #442020; --p-red: #f2877f; --p-esc-bg: #2c2550; --p-esc: #b9a6f5; --p-neutral-bg: #2a2d4a; --p-neutral: #c3c6dd; --p-blue-bg: #1b2f55; --p-blue: #8db6f2;
      --s-blue: #3987e5; --s-gray: #3b3f66; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12132a; --card: #1e2036; --soft: #262945; --ink: #f0f1fa; --ink-2: #c3c6dd; --ink-3: #9a9ec0; --line: #2f3254;
    --brand: #6b78ff; --brand-2: #8b95ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --t-green: #0ca30c; --t-escalate: #9085e9; --t-amber: #c98500; --t-red: #e34948;
    --p-green-bg: #163a1f; --p-green: #6fd88a; --p-amber-bg: #3d2f0c; --p-amber: #f0b45c; --p-red-bg: #442020; --p-red: #f2877f; --p-esc-bg: #2c2550; --p-esc: #b9a6f5; --p-neutral-bg: #2a2d4a; --p-neutral: #c3c6dd; --p-blue-bg: #1b2f55; --p-blue: #8db6f2;
    --s-blue: #3987e5; --s-gray: #3b3f66; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  a { color: var(--brand); }

  .app { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 20px; max-width: 1480px; margin: 0 auto; padding: 22px; min-height: 100vh; align-content: start; }
  .side { background: var(--card); border-radius: 28px; padding: 22px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; position: sticky; top: 22px; height: calc(100vh - 44px); }
  .logo { display: flex; align-items: center; gap: 11px; padding: 0 8px 18px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .logo i { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 800; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; border: 0; background: transparent; border-radius: 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); text-align: left; }
  .nav button:hover { background: var(--soft); }
  .nav button[aria-current="page"] { background: var(--brand); color: var(--on-brand); box-shadow: 0 8px 18px rgba(65,80,232,.28); }
  .nav svg { width: 19px; height: 19px; flex: none; }
  .nav .n { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--ink-2); }
  .nav .n.hot { background: var(--p-red-bg); color: var(--p-red); }
  .nav button[aria-current="page"] .n { background: rgba(255,255,255,.22); color: #fff; }
  .calcard { margin-top: auto; background: #1b1d33; color: #fff; border-radius: 20px; padding: 16px; }
  .calcard h4 { margin: 8px 0 4px; font-size: 15px; }
  .calcard p { margin: 0 0 10px; font-size: 12.5px; color: #b9bcd8; }
  .calcard a { display: block; text-align: center; background: #fff; color: #1b1d33; border-radius: 12px; padding: 8px; font-weight: 700; text-decoration: none; font-size: 13px; }
  .calcard .ok { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,.12); }
  .calcard svg { width: 16px; height: 16px; }

  main { min-width: 0; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
  .top h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; font-weight: 800; }
  .top .sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
  .tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .field { background: var(--card); border: 0; border-radius: 99px; box-shadow: var(--shadow); padding: 9px 16px; min-width: 0; }
  .search { position: relative; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); pointer-events: none; }
  .search input { padding-left: 36px; width: 230px; }
  select.field { cursor: pointer; padding-right: 12px; }
  .seg { display: inline-flex; background: var(--card); border-radius: 99px; padding: 4px; box-shadow: var(--shadow); }
  .seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 99px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center; }
  .icon-btn svg { width: 18px; height: 18px; }
  .banner { background: var(--p-amber-bg); color: var(--p-amber); border-radius: 16px; padding: 11px 16px; margin-bottom: 16px; font-size: 13.5px; font-weight: 500; }

  .card { background: var(--card); border-radius: 24px; padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
  .card h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .card .cap { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
  .card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .ov { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; }
  .kpi { border-radius: 24px; padding: 18px 20px; background: var(--card); box-shadow: var(--shadow); position: relative; }
  .kpi.hero { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; box-shadow: 0 14px 30px rgba(65,80,232,.32); }
  .kpi .ic { width: 42px; height: 42px; border-radius: 14px; background: var(--soft); display: grid; place-items: center; margin-bottom: 14px; }
  .kpi.hero .ic { background: rgba(255,255,255,.95); color: var(--brand); }
  .kpi .ic svg { width: 20px; height: 20px; }
  .kpi .lbl { font-weight: 600; font-size: 14px; color: var(--ink-2); }
  .kpi.hero .lbl { color: rgba(255,255,255,.92); }
  .kpi .val { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 4px; }
  .kpi .note { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
  .kpi.hero .note { color: rgba(255,255,255,.85); }
  .pillbox { position: absolute; top: 18px; right: 18px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--p-neutral-bg); color: var(--p-neutral); white-space: nowrap; }
  .pill.good, .pill.green { background: var(--p-green-bg); color: var(--p-green); } .pill.bad, .pill.red { background: var(--p-red-bg); color: var(--p-red); }
  .pill.amber { background: var(--p-amber-bg); color: var(--p-amber); } .pill.esc { background: var(--p-esc-bg); color: var(--p-esc); } .pill.blue { background: var(--p-blue-bg); color: var(--p-blue); }
  .kpi.hero .pill { background: rgba(255,255,255,.22); color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin: 4px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { font-family: inherit; fill: var(--ink-3); font-size: 11px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover, .chart .hit:focus { fill: var(--soft); opacity: .55; }
  .tabs { display: inline-flex; background: var(--soft); border-radius: 99px; padding: 3px; flex-wrap: wrap; }
  .tabs button { border: 0; background: transparent; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink-3); }
  .tabs button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(30,34,90,.12); }

  .donut-wrap { display: grid; place-items: center; position: relative; margin: 6px 0 10px; }
  .donut-c { position: absolute; text-align: center; pointer-events: none; }
  .donut-c b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .donut-c span { font-size: 12.5px; color: var(--ink-3); }
  .rows { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .row .name { flex: 1; font-weight: 600; min-width: 0; }
  .row .num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .row .sub, .sub { color: var(--ink-3); font-size: 12.5px; }
  .hbar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .hbar i { display: block; height: 100%; border-radius: 99px; background: var(--s-blue); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.lead-row td:first-child { min-width: 170px; } tr.lead-row td:nth-child(3) { min-width: 190px; } tr.lead-row td:last-child, tr.lead-row td:nth-child(6) { white-space: nowrap; }
  tr.lead-row { cursor: pointer; } tr.lead-row:hover td { background: var(--soft); } tr.lead-row.sel td { background: var(--p-blue-bg); }
  .scroll { overflow-x: auto; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--soft); color: var(--ink-2); margin: 0 4px 4px 0; }
  .tag.seed { background: var(--p-amber-bg); color: var(--p-amber); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t-red); display: inline-block; margin-right: 6px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 13px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
  .chip:hover { border-color: var(--brand); }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip .c { opacity: .75; font-weight: 700; margin-left: 4px; }
  .mini { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 5px 8px; max-width: 150px; cursor: pointer; }
  .mini:hover { border-color: var(--brand); }
  .stage { max-width: 170px; }

  .att { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 11px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 10px; }
  .att:last-child { border-bottom: 0; } .att:hover { background: var(--soft); }
  .att .ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--p-amber-bg); color: var(--p-amber); }
  .att .ico.high { background: var(--p-red-bg); color: var(--p-red); }
  .att .ico svg { width: 17px; height: 17px; }
  .att .t { flex: 1; min-width: 0; } .att .t b { display: block; }
  .att .who { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .avatar { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 800; flex: none; }

  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
  .day { background: var(--soft); border-radius: 16px; padding: 10px; min-height: 150px; min-width: 0; }
  .day.today { outline: 2px solid var(--brand); outline-offset: -2px; }
  .day h5 { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; display: flex; justify-content: space-between; }
  .ev { display: block; width: 100%; text-align: left; border: 0; border-left: 4px solid var(--s-blue); background: var(--card); border-radius: 10px; padding: 7px 9px; margin-bottom: 7px; cursor: pointer; box-shadow: 0 1px 2px rgba(30,34,90,.07); }
  .ev:hover { box-shadow: 0 2px 10px rgba(30,34,90,.16); }
  .ev b { display: block; font-size: 12.5px; } .ev span { font-size: 12px; color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev.done { opacity: .55; }

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--card); box-shadow: -12px 0 40px rgba(20,24,70,.22); z-index: 40; display: flex; flex-direction: column; transform: translateX(105%); transition: transform .18s ease; }
  .drawer.open { transform: none; }
  .drawer-h { padding: 18px 22px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .drawer-h h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .drawer-b { padding: 6px 22px 28px; overflow-y: auto; flex: 1; }
  .sec { padding: 16px 0; border-bottom: 1px solid var(--line); } .sec:last-child { border-bottom: 0; }
  .sec > h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lab { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; margin-bottom: 4px; }
  .inp { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 11px; }
  textarea.inp { resize: vertical; min-height: 64px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 13.5px; } .kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
  .tl { list-style: none; margin: 10px 0 0; padding: 0; } .tl li { padding: 8px 0 8px 16px; border-left: 2px solid var(--line); position: relative; font-size: 13.5px; } .tl li::before { content: ""; position: absolute; left: -5px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); } .tl .sub { display: block; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 14px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); display: inline-block; }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; } .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn.warn:hover { border-color: var(--t-red); color: var(--t-red); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .consult { background: var(--p-blue-bg); border-radius: 16px; padding: 14px; }
  .consult b { font-size: 16px; color: var(--ink); }
  .backdrop { position: fixed; inset: 0; background: rgba(15,18,50,.35); z-index: 39; display: none; } .backdrop.on { display: block; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: #1b1d33; color: #fff; padding: 11px 18px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); z-index: 80; opacity: 0; pointer-events: none; transition: .2s; font-weight: 600; max-width: 90vw; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); } .toast.bad { background: #a82525; }

  details { background: var(--card); border-radius: 18px; padding: 12px 18px; margin-bottom: 10px; box-shadow: var(--shadow); }
  details.flat { box-shadow: none; padding: 0; margin: 0; background: transparent; }
  summary { cursor: pointer; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--soft); border-radius: 14px; padding: 12px; font: 12.5px/1.55 ui-monospace, Menlo, Consolas, monospace; margin: 10px 0 0; max-height: 320px; overflow: auto; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; }
  .stack { height: 14px; border-radius: 99px; overflow: hidden; display: flex; gap: 2px; background: var(--soft); margin: 10px 0 6px; }
  .stack i { display: block; height: 100%; }
  .empty { color: var(--ink-3); padding: 18px 4px; }
  .foot { color: var(--ink-3); font-size: 12px; margin: 22px 4px 0; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: #1b1d33; color: #fff; border-radius: 12px; padding: 8px 12px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: 260px; opacity: 0; transition: opacity .08s; }
  .tip.on { opacity: 1; } .tip b { display: block; margin-bottom: 2px; } .tip .r { display: flex; align-items: center; gap: 7px; }
  .busy { opacity: .6; transition: opacity .15s; }

  @media (max-width: 1100px) { .ov { grid-template-columns: 1fr; } .week { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px; border-radius: 22px; overflow-x: auto; gap: 8px; }
    .logo { padding: 0 8px 0 4px; } .calcard { display: none; }
    .nav { flex-direction: row; } .nav button { width: auto; white-space: nowrap; padding: 9px 12px; } .nav .n { display: none; }
    .search input { width: 100%; } .search { flex: 1 1 200px; }
  }
  @media (max-width: 520px) { .top h1 { font-size: 22px; } .card { padding: 16px; border-radius: 20px; } .grid2 { grid-template-columns: 1fr; } .kv { grid-template-columns: 90px 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i aria-hidden="true">A</i> Aangan</div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="calcard" id="calcard"></div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="title">Overview</h1><div class="sub" id="subtitle"></div></div>
      <div class="tools">
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" class="field" type="search" placeholder="Search name, number, area   ( / )" aria-label="Search leads"></label>
        <select id="role" class="field" aria-label="Viewing as"></select>
        <div class="seg" id="srcseg" role="group" aria-label="Data source">
          <button data-src="all" aria-pressed="true">All</button>
          <button data-src="live" aria-pressed="false">Live</button>
          <button data-src="seed" aria-pressed="false">Test</button>
        </div>
        <button class="icon-btn" id="theme" aria-label="Toggle light and dark theme" title="Light / dark"></button>
      </div>
    </header>
    <div id="banner"></div>
    <div id="app" aria-live="polite">Loading…</div>
    <p class="foot" id="foot"></p>
  </main>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Lead details" aria-hidden="true"></aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (x) => (x == null ? 'n/a' : Math.round(x * 100) + '%');
const money = (x, cur = 'INR') => (x == null ? 'n/a' : (cur === 'INR' ? '₹' : cur + ' ') + Number(x).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const ms = (x) => (x == null ? 'n/a' : x < 1000 ? Math.round(x) + ' ms' : (x / 1000).toFixed(1) + ' s');
const dshort = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const TIER = { green: { name: 'Green', cls: 'green', color: 'var(--t-green)', what: 'sent to a designer' }, amber: { name: 'Amber', cls: 'amber', color: 'var(--t-amber)', what: 'needs a human follow-up' }, red: { name: 'Red', cls: 'red', color: 'var(--t-red)', what: 'politely declined' }, escalate: { name: 'Escalate', cls: 'esc', color: 'var(--t-escalate)', what: 'existing-client complaint' } };
const STACK = ['green', 'escalate', 'amber', 'red']; // order validated for colour-blind separation
const STAGE = { new: ['New', ''], contacted: ['Contacted', 'blue'], consult_booked: ['Consultation booked', 'esc'], consult_done: ['Consultation done', 'blue'], won: ['Won', 'good'], lost: ['Lost', 'bad'], resolved: ['Resolved', 'good'] };
const FLOW = { green: ['new', 'contacted', 'consult_booked', 'consult_done', 'won', 'lost'], amber: ['new', 'contacted', 'resolved'], escalate: ['new', 'contacted', 'resolved'] };
const FIELD_LABELS = [['locality', 'Locality'], ['property_type', 'Property'], ['carpet_area_sqft', 'Carpet area'], ['scope', 'Scope'], ['timeline_text', 'Timeline'], ['decision_maker', 'Who decides'], ['referral_source', 'Referral'], ['preferred_window', 'Asked for']];
const PALETTE = ['#2a78d6', '#c4468f', '#0f8f7e', '#8a5ad6', '#c46a1a', '#5a6bd6'];

const ICON = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  leads: '<path d="M4 20c0-3.5 3.6-6 8-6s8 2.5 8 6"/><circle cx="12" cy="8" r="4"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  flag: '<path d="M5 21V4m0 0h11l-2 4 2 4H5"/>',
  coin: '<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-1-1.5-1.5-2.8-1.5-1.6 0-2.8.8-2.8 2s1.2 1.7 2.8 2 2.8.8 2.8 2-1.2 2-2.8 2c-1.3 0-2.4-.6-2.9-1.6M12 6v1.7m0 8.6V18"/>',
  shield: '<path d="M12 3 4.5 6v5.5c0 4.5 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5 7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4m8-4v4M3.5 10h17"/>',
  alert: '<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5m0 3h.01"/>',
  heart: '<path d="M4.5 12.5h3l2-4 3.5 8 2-4h4.5"/><rect x="3" y="4" width="18" height="16" rx="4"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

const state = { src: 'all', tab: (location.hash || '#overview').slice(1), range: 30, tables: {}, m: null, role: null, q: '', f: { scope: 'open', tier: 'all', stage: 'all', owner: 'all' }, week: 0, deskFilter: 'all', drawer: null, detail: null };
try { state.role = new URLSearchParams(location.search).get('as') || localStorage.getItem('aangan-role'); } catch { /* storage unavailable */ }

/* ---------- roles: who is looking decides what they see (a personal view, not a login) ---------- */
const rolesOf = (m) => [
  { id: 'admin', kind: 'admin', name: m.team.admin.name, owner: m.team.admin.id, label: `${m.team.admin.name} — studio head` },
  { id: 'frontdesk', kind: 'frontdesk', name: 'Front desk', owner: null, label: 'Front desk' },
  ...m.team.designers.map((d) => ({ id: d.id, kind: 'designer', name: d.name, owner: d.id, label: `${d.name}${d.active ? '' : ' (away)'}` })),
];
const me = (m) => rolesOf(m).find((r) => r.id === state.role) || rolesOf(m)[0];
const TABS_BY = { admin: ['overview', 'leads', 'schedule', 'spotcheck', 'health'], frontdesk: ['overview', 'leads', 'schedule'], designer: ['overview', 'leads', 'schedule'] };
const TAB_META = { overview: ['Overview', 'grid'], leads: ['Leads', 'leads'], schedule: ['Schedule', 'cal'], spotcheck: ['Spot-check', 'flag'], health: ['Cost & health', 'heart'] };
const colorOf = (m, id) => { const i = m.team.owners.findIndex((o) => o.id === id); return i < 0 ? 'var(--s-gray)' : PALETTE[i % PALETTE.length]; };
const initials = (n) => String(n || '?').split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
const avatar = (m, id, name) => `<span class="avatar" style="background:${colorOf(m, id)}" title="${esc(name)}">${esc(initials(name))}</span>`;

/* ---------- formatting ---------- */
const tz = () => state.m?.team.tz || 'Asia/Kolkata';
const fmtDT = (iso) => new Date(iso).toLocaleString('en-GB', { timeZone: tz(), weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).replace(/,/g, '');
const fmtT = (iso) => new Date(iso).toLocaleTimeString('en-GB', { timeZone: tz(), hour: '2-digit', minute: '2-digit', hour12: false });
const ymd = (iso) => new Date(iso).toLocaleDateString('en-CA', { timeZone: tz() });
const dp = (p) => (p ? `+91 ${p.replace('+91', '').slice(0, 5)} ${p.replace('+91', '').slice(5)}` : 'number withheld');
const ago = (iso) => { if (!iso) return '—'; const s = (Date.now() - new Date(iso)) / 1000; if (s < 90) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min'; if (s < 86400) return Math.round(s / 3600) + ' h'; if (s < 30 * 86400) return Math.round(s / 86400) + ' d'; return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const name = (l) => l.fields?.name || 'Unknown caller';
const seedTag = (s) => (s === 'seed' ? '<span class="tag seed">test</span>' : '');
const flagPills = (f) => (f || []).map((x) => `<span class="tag">${esc(x.replace(/_/g, ' '))}</span>`).join('');
const tierPill = (t) => `<span class="pill ${TIER[t]?.cls || ''}">${TIER[t]?.name || t}</span>`;
const stagePill = (s) => `<span class="pill ${STAGE[s]?.[1] || ''}">${esc(STAGE[s]?.[0] || s)}</span>`;

/* ---------- visibility ---------- */
const myLeads = (m) => { const r = me(m); return r.kind === 'designer' ? m.leads.filter((l) => l.ownerId === r.owner) : m.leads; };
const myAttention = (m) => { const r = me(m); return r.kind === 'designer' ? m.attention.filter((a) => a.ownerId === r.owner) : m.attention; };
const consultsOf = (m) => myLeads(m).filter((l) => l.consult && ['scheduled', 'done'].includes(l.consult.status));

function delta(d, goodUp = true) {
  if (!d || d.pct == null) return '';
  const up = d.pct > 0, flat = d.pct === 0, good = flat ? null : (up === goodUp);
  return `<span class="pill ${flat ? '' : good ? 'good' : 'bad'}" title="Last 7 days: ${d.cur} · previous 7 days: ${d.prev}">${flat ? '＝' : up ? '▲' : '▼'} ${Math.abs(d.pct)}%</span>`;
}
function kpi(cls, icon, label, value, note, pill = '') { return `<div class="kpi ${cls}">${pill ? `<span class="pillbox">${pill}</span>` : ''}<div class="ic">${svg(icon)}</div><div class="lbl">${esc(label)}</div><div class="val">${value}</div><div class="note">${note}</div></div>`; }
const niceMax = (v) => { if (v <= 4) return 4; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
const topRound = (x, y, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
const tipAttr = (title, rows) => esc(JSON.stringify({ t: title, r: rows }));
const toggleBtn = (id) => `<div class="tabs" role="group" aria-label="Chart or table"><button data-toggle="${id}" data-mode="chart" aria-pressed="${!state.tables[id]}">Chart</button><button data-toggle="${id}" data-mode="table" aria-pressed="${!!state.tables[id]}">Table</button></div>`;

/* ---------- charts (company-wide: studio head and front desk only) ---------- */
function dailyChart(m) {
  const all = m.series.daily; const days = state.range === 0 ? all : all.slice(-state.range);
  const total = days.reduce((a, d) => a + d.calls, 0);
  const legend = `<div class="legend">${STACK.map((t) => `<span><i class="sw" style="background:${TIER[t].color}"></i>${TIER[t].name} ${days.reduce((a, d) => a + d[t], 0)}</span>`).join('')}</div>`;
  if (state.tables.daily) {
    return `${legend}<div class="scroll" style="max-height:300px;overflow:auto"><table><thead><tr><th>Day</th>${STACK.map((t) => `<th>${TIER[t].name}</th>`).join('')}<th>Total</th></tr></thead><tbody>${[...days].reverse().map((d) => `<tr><td>${dshort(d.date)}</td>${STACK.map((t) => `<td>${d[t]}</td>`).join('')}<td><b>${d.calls}</b></td></tr>`).join('')}</tbody></table></div>`;
  }
  const W = 640, H = 250, L = 30, R = 6, T = 10, B = 28, pw = W - L - R, ph = H - T - B;
  const max = niceMax(Math.max(1, ...days.map((d) => d.calls)));
  const slot = pw / days.length, bw = Math.min(26, slot * 0.62);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = (max / 4) * i, y = T + ph - (v / max) * ph; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  const every = Math.ceil(days.length / 8);
  days.forEach((d, i) => {
    const cx = L + slot * i + slot / 2, x = cx - bw / 2;
    let acc = 0, bars = ''; const nz = STACK.filter((t) => d[t] > 0), topT = nz[nz.length - 1];
    for (const t of STACK) {
      if (!d[t]) continue;
      const h = (d[t] / max) * ph, y = T + ph - acc - h; acc += h;
      bars += t === topT ? `<path d="${topRound(x, y, bw, h, 5)}" fill="${TIER[t].color}" stroke="var(--card)" stroke-width="2"/>` : `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${TIER[t].color}" stroke="var(--card)" stroke-width="2"/>`;
    }
    const rows = [...STACK.filter((t) => d[t]).map((t) => ({ c: TIER[t].color, k: TIER[t].name, v: d[t] })), { k: 'Total', v: d.calls }];
    g += `${bars}<rect class="hit" tabindex="0" role="img" aria-label="${esc(dshort(d.date))}: ${d.calls} calls" x="${L + slot * i}" y="${T}" width="${slot}" height="${ph}" data-tip="${tipAttr(dshort(d.date), rows)}"/>`;
    if (i % every === 0 && (days.length - 1 - i >= every * 0.6 || i === days.length - 1)) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${dshort(d.date)}</text>`;
  });
  return `${legend}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calls per day by tier, ${total} calls in ${days.length} days">${g}</svg>`;
}

function donut(m) {
  const t = m.tiers, tot = t.green + t.amber + t.red + t.escalate;
  const R = 84, r = 58, C = 100;
  let segs = ''; const parts = STACK.map((k) => [k, t[k]]).filter(([, n]) => n > 0);
  if (!tot) segs = `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="var(--line)" stroke-width="${R - r}"/>`;
  else if (parts.length === 1) segs = `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="${TIER[parts[0][0]].color}" stroke-width="${R - r}"/>`;
  else {
    let a0 = -Math.PI / 2;
    for (const [k, n] of parts) {
      const a1 = a0 + (n / tot) * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0, p = (a, rad) => [C + rad * Math.cos(a), C + rad * Math.sin(a)];
      const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [x2, y2] = p(a1, r), [x3, y3] = p(a0, r);
      segs += `<path d="M${x0},${y0}A${R},${R} 0 ${large} 1 ${x1},${y1}L${x2},${y2}A${r},${r} 0 ${large} 0 ${x3},${y3}Z" fill="${TIER[k].color}" stroke="var(--card)" stroke-width="2" tabindex="0" data-tip="${tipAttr(TIER[k].name, [{ c: TIER[k].color, k: TIER[k].what, v: `${n} (${Math.round((n / tot) * 100)}%)` }])}"/>`;
      a0 = a1;
    }
  }
  const order = ['green', 'amber', 'red', 'escalate'];
  return `<div class="donut-wrap"><svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Tier mix of ${tot} enquiries">${segs}</svg><div class="donut-c"><b>${tot}</b><span>enquiries</span></div></div>
  <div class="rows">${order.map((k) => `<div class="row"><span class="sw" style="background:${TIER[k].color}"></span><span class="name">${TIER[k].name}<div class="sub">${TIER[k].what}</div></span><span class="num">${t[k]}</span><span class="pill ${TIER[k].cls}">${tot ? Math.round((t[k] / tot) * 100) : 0}%</span></div>`).join('')}</div>`;
}

function hourly(m) {
  const hs = m.series.hourly, total = hs.reduce((a, h) => a + h.calls, 0), after = hs.filter((h) => !h.office).reduce((a, h) => a + h.calls, 0);
  const legend = `<div class="legend"><span><i class="sw" style="background:var(--s-gray)"></i>Office hours ${m.series.officeHours.start}:00–${m.series.officeHours.end}:00</span><span><i class="sw" style="background:var(--s-blue)"></i>After hours</span></div>`;
  if (state.tables.hourly) return `${legend}<div class="scroll" style="max-height:260px;overflow:auto"><table><thead><tr><th>Hour</th><th>Calls</th><th>Window</th></tr></thead><tbody>${hs.map((h) => `<tr><td>${String(h.hour).padStart(2, '0')}:00</td><td>${h.calls}</td><td>${h.office ? 'office hours' : 'after hours'}</td></tr>`).join('')}</tbody></table></div>`;
  const W = 480, H = 170, L = 22, T = 8, B = 24, pw = W - L, ph = H - T - B, max = niceMax(Math.max(1, ...hs.map((h) => h.calls))), slot = pw / 24, bw = slot * 0.62;
  let g = [0, max / 2, max].map((v) => { const y = T + ph - (v / max) * ph; return `<line class="grid" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L - 5}" y="${y + 4}" text-anchor="end">${Math.round(v)}</text>`; }).join('');
  hs.forEach((h) => {
    const x = L + slot * h.hour + (slot - bw) / 2, bh = (h.calls / max) * ph, y = T + ph - bh;
    if (h.calls) g += `<path d="${topRound(x, y, bw, bh, 4)}" fill="${h.office ? 'var(--s-gray)' : 'var(--s-blue)'}"/>`;
    g += `<rect class="hit" tabindex="0" role="img" aria-label="${h.hour}:00, ${h.calls} calls" x="${L + slot * h.hour}" y="${T}" width="${slot}" height="${ph}" data-tip="${tipAttr(String(h.hour).padStart(2, '0') + ':00–' + String((h.hour + 1) % 24).padStart(2, '0') + ':00', [{ c: h.office ? 'var(--s-gray)' : 'var(--s-blue)', k: h.office ? 'Office hours' : 'After hours', v: h.calls + (h.calls === 1 ? ' call' : ' calls') }])}"/>`;
    if ([0, 6, 12, 18, 23].includes(h.hour)) g += `<text x="${L + slot * h.hour + slot / 2}" y="${H - 6}" text-anchor="middle">${h.hour}h</text>`;
  });
  return `${legend}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calls by hour of day, ${after} of ${total} outside office hours">${g}</svg>
  <div class="cap" style="margin-top:8px"><b>${after}</b> of ${total} calls (${total ? Math.round((after / total) * 100) : 0}%) arrived outside office hours.</div>`;
}

function topFlags(m, n = 7) {
  const fl = m.series.flags.slice(0, n), max = Math.max(1, ...fl.map((f) => f.count));
  if (!fl.length) return '<div class="empty">No notes yet.</div>';
  return `<div class="rows">${fl.map((f) => `<div><div class="row" style="padding-bottom:0"><span class="name" style="font-weight:500">${esc(f.label)}</span><span class="num">${f.count}</span></div><div class="hbar" data-tip="${tipAttr(f.label, [{ k: 'Enquiries', v: f.count }])}"><i style="width:${(f.count / max) * 100}%"></i></div></div>`).join('')}</div>`;
}

/* ---------- shared pieces ---------- */
function attentionCard(m, title = 'Needs attention') {
  const items = myAttention(m);
  const ico = { unassigned: 'leads', not_picked_up: 'clock', stale: 'clock', escalation: 'alert', callback_due: 'phone', queue_waiting: 'clock', consult_overdue: 'cal' };
  const body = items.length ? items.slice(0, 8).map((a) => `<button class="att" data-open="${esc(a.enquiryId)}"><span class="ico ${a.sev}">${svg(ico[a.kind] || 'alert')}</span><span class="t"><b>${esc(a.name || dp(a.phone))}</b><span class="sub">${esc(a.text)}</span></span><span class="who">${a.ownerId ? esc(m.team.owners.find((o) => o.id === a.ownerId)?.name || '') : 'unassigned'}<br>${ago(a.since)} ago</span></button>`).join('') + (items.length > 8 ? `<div class="sub" style="padding:8px 6px">+ ${items.length - 8} more</div>` : '')
    : `<div class="empty">${m.source === 'seed' ? 'Alerts only apply to live leads.' : 'All clear — nothing is waiting.'}</div>`;
  return `<section class="card"><div class="card-h"><div><h3>${title}</h3><div class="cap">Unassigned leads, notes nobody picked up, due call-backs, stale leads</div></div>${items.length ? `<span class="pill bad">${items.length}</span>` : ''}</div>${body}</section>`;
}

function upcomingCard(m) {
  const now = new Date(m.now).getTime();
  const L = consultsOf(m).filter((l) => l.consult.status === 'scheduled' && new Date(l.consult.end).getTime() >= now).sort((a, b) => a.consult.start.localeCompare(b.consult.start)).slice(0, 6);
  const body = L.length ? L.map((l) => `<button class="att" data-open="${esc(l.id)}"><span class="ico" style="background:var(--p-blue-bg);color:var(--p-blue)">${svg('cal')}</span><span class="t"><b>${esc(fmtDT(l.consult.start))}</b><span class="sub">${esc(name(l))}${l.fields?.locality ? ' · ' + esc(l.fields.locality) : ''}</span></span><span class="who">${avatar(m, l.consult.designerId, m.team.owners.find((o) => o.id === l.consult.designerId)?.name)}</span></button>`).join('')
    : '<div class="empty">No consultations booked yet. Open a Green lead and book one — it also gives you a one-click Google Calendar entry.</div>';
  return `<section class="card"><div class="card-h"><div><h3>Upcoming consultations</h3><div class="cap">Next on the calendar</div></div></div>${body}</section>`;
}

function workloadCard(m) {
  const rows = m.team.workload, none = rows.find((w) => w.id === null);
  return `<section class="card"><div class="card-h"><div><h3>Team workload</h3><div class="cap">Leads in this view by owner — click a name to see their leads</div></div>${none ? `<button class="btn primary" data-act="auto_assign_all" title="Gives each lead without a designer to the designer with the fewest open leads">Share out ${none.open} unassigned</button>` : ''}</div><div class="scroll"><table><thead><tr><th>Owner</th><th>Open</th><th>Not picked up</th><th>Consults 7d</th><th>Won / lost</th><th>Pickup</th></tr></thead><tbody>${rows.map((w) => `<tr><td><button class="att" style="padding:2px 0;border:0" data-owner="${esc(w.id ?? 'none')}">${w.id === null ? '<span class="avatar" style="background:var(--s-gray)">?</span>' : avatar(m, w.id, w.name)}<b>${esc(w.name)}</b>${w.active ? '' : ' <span class="tag">away</span>'}</button></td><td>${w.open}</td><td>${w.awaitingPickup ? `<span class="pill bad">${w.awaitingPickup}</span>` : 0}</td><td>${w.consultsWeek}</td><td>${w.won} / ${w.lost}</td><td>${w.medianPickupMin == null ? '—' : w.medianPickupMin + ' min'}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function pipelineCard(m) {
  const L = myLeads(m).filter((l) => l.tier === 'green'), max = Math.max(1, ...FLOW.green.map((s) => L.filter((l) => l.stage === s).length));

function filteredLeads(m) {
  let L = myLeads(m); const f = state.f;
  if (f.scope === 'open') L = L.filter((l) => !l.closed);
  else if (f.scope === 'closed') L = L.filter((l) => l.closed);
  else if (f.scope === 'unassigned') L = L.filter((l) => !l.ownerId && !l.closed);
  if (f.tier !== 'all') L = L.filter((l) => l.tier === f.tier);
  if (f.stage !== 'all') L = L.filter((l) => l.stage === f.stage);
  if (f.owner !== 'all') L = L.filter((l) => (f.owner === 'none' ? !l.ownerId : l.ownerId === f.owner));
  if (state.q) {
    const q = state.q.toLowerCase(), dgt = q.replace(/\D/g, '');
    L = L.filter((l) => [name(l), l.fields?.locality, l.fields?.property_type, l.summary, l.ownerName].join(' ').toLowerCase().includes(q) || (dgt.length >= 3 && (l.phone || '').replace(/\D/g, '').includes(dgt)));
  }
  const hot = new Set(m.attention.map((x) => x.enquiryId));
  return L.map((l) => ({ ...l, hot: hot.has(l.id) })).sort((a, b) => Number(b.hot) - Number(a.hot) || b.updatedAt.localeCompare(a.updatedAt));
}

function ownerSelect(m, l) {

}

/* ---------- schedule: a week at a glance + what still needs a time ---------- */
function weekDays(offset) {
  const today = ymd(new Date(state.m.now)); const [y, mo, d] = today.split('-').map(Number);
  const base = new Date(Date.UTC(y, mo - 1, d)); const dow = (base.getUTCDay() + 6) % 7; // Monday = 0
  base.setUTCDate(base.getUTCDate() - dow + offset * 7);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(base); x.setUTCDate(base.getUTCDate() + i); return x.toISOString().slice(0, 10); });
}
function vSchedule(m) {
  const r = me(m), days = weekDays(state.week), today = ymd(new Date(m.now));
  const all = consultsOf(m).filter((l) => state.deskFilter === 'all' || l.consult.designerId === state.deskFilter);
  const todo = myLeads(m).filter((l) => l.tier === 'green' && !l.closed && l.consult?.status !== 'scheduled' && !['consult_done', 'won', 'lost'].includes(l.stage)).sort((a, b) => (b.fields?.preferred_window ? 1 : 0) - (a.fields?.preferred_window ? 1 : 0) || b.updatedAt.localeCompare(a.updatedAt));

    const evs = all.filter((l) => ymd(l.consult.start) === day).sort((a, b) => a.consult.start.localeCompare(b.consult.start));
    const label = new Date(day + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    return `<div class="day ${day === today ? 'today' : ''}"><h5><span>${label}</span>${evs.length ? `<span>${evs.length}</span>` : ''}</h5>${evs.map((l) => `<button class="ev ${l.consult.status === 'done' ? 'done' : ''}" style="border-left-color:${colorOf(m, l.consult.designerId)}" data-open="${esc(l.id)}"><b>${fmtT(l.consult.start)}–${fmtT(l.consult.end)}</b><span>${esc(name(l))}</span><span>${esc(m.team.owners.find((o) => o.id === l.consult.designerId)?.name || '')}${l.consult.status === 'done' ? ' · done' : ''}</span></button>`).join('') || '<div class="sub" style="padding:4px 2px">—</div>'}</div>`;

    <section class="card"><div class="card-h"><div><h3>Waiting for a time (${todo.length})</h3><div class="cap">Green leads with no consultation booked — the caller’s preferred slot is shown</div></div></div>${todo.length ? todo.slice(0, 12).map((l) => `<button class="att" data-open="${esc(l.id)}" data-focus="sched"><span class="ico" style="background:var(--p-green-bg);color:var(--p-green)">${svg('cal')}</span><span class="t"><b>${esc(name(l))}${l.fields?.locality ? ' · ' + esc(l.fields.locality) : ''}</b><span class="sub">${l.fields?.preferred_window ? 'Asked for: ' + esc(l.fields.preferred_window) : 'No preferred slot captured'}</span></span><span class="who">${l.ownerId ? esc(l.ownerName || '') : 'unassigned'}</span></button>`).join('') : '<div class="empty">Every Green lead has a consultation booked.</div>'}</section>`;

  const consultBlock = sched ? `<div class="consult"><b>${esc(fmtDT(c.start))} – ${esc(fmtT(c.end))}</b><div class="sub">with ${esc(designerName(c.designerId))}${c.bookedBy === 'phone_ai' ? ' · held by the AI on the call' : ''}${c.callerEmail ? ' · invite to ' + esc(c.callerEmail) : c.bookedBy === 'phone_ai' ? ' · no email captured — confirm by phone' : ''}</div>
      <div class="actions">${cal ? `<a class="btn primary" href="${esc(cal.google)}" target="_blank" rel="noopener">Add to Google Calendar</a><a class="btn" href="${esc(cal.ics)}">Download .ics</a><a class="btn" href="${esc(cal.week)}" target="_blank" rel="noopener">Open that week</a>` : ''}
      <button class="btn" data-act="stage" data-stage="consult_done" data-id="${esc(l.id)}">Mark done</button><button class="btn warn" data-act="cancel_consult" data-id="${esc(l.id)}">Cancel</button></div></div>
      <details class="flat" style="margin-top:12px"><summary class="sub" style="font-weight:600">Change the time</summary><div style="margin-top:10px">${schedForm}</div></details>`
    : `${c?.status === 'done' ? `<p class="sub">Consultation held ${esc(fmtDT(c.start))}.</p>` : ''}${c?.status === 'cancelled' ? '<p class="sub">The earlier consultation was cancelled.</p>' : ''}${schedForm}`;
  const h = l.handoff;
  const handoff = [
    l.tier === 'escalate' ? `Paged the studio head ${h.pagedAt ? ago(h.pagedAt) + ' ago' : '—'}` : h.telegramSentAt ? `Telegram note sent ${ago(h.telegramSentAt)} ago` : 'No Telegram note sent',
    h.ackAt ? `Picked up${h.ackBy ? ' by ' + h.ackBy : ''} ${ago(h.ackAt)} ago` : l.tier === 'green' && h.telegramSentAt ? 'Not yet picked up' : null,
    l.tier === 'green' ? `HubSpot: ${h.hubspot || '—'}` : null,
  ].filter(Boolean).map((x) => `<div>${esc(x)}</div>`).join('');
  el.innerHTML = `<div class="drawer-h"><div style="flex:1;min-width:0"><h2>${esc(name(l))}</h2><div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${tierPill(l.tier)} ${seedTag(l.source)}${l.repeat ? '<span class="tag">repeat caller</span>' : ''}<a href="tel:${esc(l.phone || '')}" ${l.phone ? '' : 'style="pointer-events:none;color:inherit"'}><b>${esc(dp(l.phone))}</b></a>${l.phone ? `<button class="btn" style="padding:3px 10px" data-copy="${esc(l.phone)}">Copy</button>` : ''}</div></div><button class="icon-btn" data-close aria-label="Close details">${svg('close')}</button></div>
  <div class="drawer-b">
   <div class="sec"><h4>Owner &amp; stage</h4><div class="grid2"><div><label class="lab" for="d-owner">Designer</label><select id="d-owner" class="inp" data-assign="${esc(l.id)}">${l.ownerId ? '' : '<option value="" selected disabled>Unassigned — pick one</option>'}${ownerOpts}</select></div><div><label class="lab" for="d-stage">Stage</label><select id="d-stage" class="inp" data-stage="${esc(l.id)}">${stageOpts}</select></div></div><div class="sub" style="margin-top:8px">${l.ownerAuto ? 'Auto-assigned to the designer with the fewest open leads. ' : ''}Changing the designer posts a note to the designer group on Telegram.</div></div>
   ${l.tier === 'green' ? `<div class="sec" id="sched-sec"><h4>Consultation</h4>${f.preferred_window ? `<p style="margin:0 0 12px">Caller asked for: <b>${esc(f.preferred_window)}</b></p>` : ''}${consultBlock}</div>` : ''}
   <div class="sec"><h4>About the caller</h4>${l.summary ? `<p style="margin:0 0 10px">${esc(l.summary)}</p>` : ''}<dl class="kv">${kv}</dl><div style="margin-top:10px">${flagPills(l.flags)}</div>${l.tier === 'amber' ? `<div class="sub" style="margin-top:8px">Why it needs a person: ${esc(l.reason || '—')}${l.callbacks.length ? '<br>Call-backs: ' + l.callbacks.map((cb) => `#${cb.attempt} ${esc(cb.dueAt.slice(5, 16).replace('T', ' '))} (${esc(cb.status)})`).join(', ') : ''}</div>` : ''}</div>
   <div class="sec"><h4>Handoff</h4><div class="sub" style="line-height:1.7">${handoff}</div></div>
   <div class="sec"><h4>Notes &amp; activity</h4><form data-form="note" data-id="${esc(l.id)}"><label class="lab" for="n-text">Add a note (visible to the whole team)</label><textarea id="n-text" class="inp" name="text" maxlength="500" placeholder="e.g. Spoke to them, site visit on Saturday"></textarea><div class="actions"><button class="btn" type="submit">Add note</button></div></form>
     <ul class="tl">${dtl ? (dtl.activity.length ? dtl.activity.map((a) => `<li>${esc(a.text)}<span class="sub">${esc(a.by || 'system')} · ${esc(fmtDT(a.at))}</span></li>`).join('') : '<li class="sub">Nothing yet.</li>') : '<li class="sub">Loading…</li>'}</ul></div>
   <div class="sec"><h4>Call transcript</h4>${dtl ? `<details class="flat"><summary class="sub" style="font-weight:600">Show transcript (${l.calls} call${l.calls === 1 ? '' : 's'})</summary><pre>${esc(dtl.transcript)}</pre></details>` : d?.error ? `<div class="sub">Could not load: ${esc(d.error)}</div>` : '<div class="sub">Loading…</div>'}</div>
  </div>`;
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg, bad = false) { const t = $('#toast'); t.textContent = msg; t.classList.toggle('bad', bad); t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 3200); }
/** POST JSON. If the studio set a team PIN (DASHBOARD_TEAM_PIN) the server answers 403 pinRequired: ask once, remember it in this browser, retry. */
async function postJson(url, payload, retried = false) {
  let pin = ''; try { pin = localStorage.getItem('aangan-pin') || ''; } catch { /* storage unavailable */ }
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', ...(pin ? { 'x-team-pin': pin } : {}) }, body: JSON.stringify(payload) });
  if (r.status === 403 && !retried) {
    const j = await r.clone().json().catch(() => ({}));
    if (j.pinRequired) { const p = prompt('Enter the team PIN to make changes'); if (p) { try { localStorage.setItem('aangan-pin', p.trim()); } catch { /* ignore */ } return postJson(url, payload, true); } }
  }
  return r;
}
async function act(body, force = false) {
  let r, j;
  try { r = await postJson('/api/action', { ...body, by: actor(), ...(force ? { force: true } : {}) }); j = await r.json().catch(() => ({})); }
  catch { toast('Could not reach the server', true); return { ok: false }; }
  if (r.status === 403 && j.pinRequired) { try { localStorage.removeItem('aangan-pin'); } catch { /* ignore */ } toast('That PIN was not accepted', true); return { ok: false }; }
  if (r.status === 409 && j.needsConfirm) return confirm(`${j.error}\n\nBook it anyway?`) ? act(body, true) : { ok: false, cancelled: true };
  if (!r.ok) { toast(j.error || 'Something went wrong', true); return { ok: false }; }
  await load(true);
  if (state.drawer === body.enquiryId) { state.detail = null; renderDrawer(); try { const x = await fetch('/api/lead?id=' + encodeURIComponent(body.enquiryId)); if (x.ok && state.drawer === body.enquiryId) { state.detail = await x.json(); renderDrawer(); } } catch { /* shown on next open */ } }
  return { ok: true };
}
const csvCell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCsv() {
  const rows = [['Name', 'Phone', 'Tier', 'Owner', 'Stage', 'Locality', 'Property', 'Carpet area (sq ft)', 'Consultation', 'Last updated']];
  for (const l of filteredLeads(state.m)) rows.push([name(l), l.phone, l.tier, l.ownerName, STAGE[l.stage]?.[0], l.fields?.locality, l.fields?.property_type, l.fields?.carpet_area_sqft, l.consult?.status === 'scheduled' ? fmtDT(l.consult.start) : '', l.updatedAt]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map(csvCell).join(',')).join('\n')], { type: 'text/csv' })); a.download = 'aangan-leads.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- shell ---------- */
const SUB = { overview: 'Aangan Studio — phone enquiries', leads: 'Everyone who called and needs a person', schedule: 'Consultations and who is booked when', spotcheck: 'Review the declined calls', health: 'What the system costs and how it is behaving' };
function render(m) {
  if (!m.series || !m.leads) throw new Error('the server is running an older version — restart it');
  state.m = m;
  const roles = rolesOf(m);
  if (!roles.some((r) => r.id === state.role)) state.role = 'admin';
  const r = me(m), tabs = TABS_BY[r.kind];
  if (!tabs.includes(state.tab)) state.tab = 'overview';
  const open = [...document.querySelectorAll('details[open]')].map((d) => d.dataset.key);
  const roleSel = $('#role'); if (!roleSel.options.length || roleSel.dataset.n !== String(roles.length)) { roleSel.innerHTML = roles.map((x) => `<option value="${esc(x.id)}">${esc(x.label)}</option>`).join(''); roleSel.dataset.n = String(roles.length); }
  roleSel.value = state.role;
  $('#srcseg').style.display = r.kind === 'designer' ? 'none' : '';
  const mine = myLeads(m), att = myAttention(m);
  $('#nav').innerHTML = tabs.map((id) => {
    const n = id === 'leads' ? mine.filter((l) => !l.closed).length : id === 'overview' ? att.length : id === 'spotcheck' ? m.reds.filter((x) => !x.review).length : 0;
    return `<button data-tab="${id}" ${state.tab === id ? 'aria-current="page"' : ''}>${svg(TAB_META[id][1])}<span>${id === 'overview' && r.kind === 'designer' ? 'My day' : TAB_META[id][0]}</span>${n ? `<span class="n ${id === 'overview' ? 'hot' : ''}" title="${id === 'spotcheck' ? 'not yet reviewed' : id === 'overview' ? 'needs attention' : 'open'}">${n}</span>` : ''}</button>`;
  }).join('');
  $('#calcard').innerHTML = `<span class="ok">${svg('cal')}</span><h4>Studio calendar</h4><p>Your shared Google Calendar.</p><a href="${esc(m.team.calendarViewUrl)}" target="_blank" rel="noopener">Open Google Calendar</a>`;
  $('#title').textContent = state.tab === 'overview' && r.kind === 'designer' ? `Hi ${r.name.split(' ')[0]}` : TAB_META[state.tab][0];
  $('#subtitle').textContent = state.tab === 'overview' ? `${r.kind === 'designer' ? 'Your leads and consultations' : SUB.overview} · data up to ${dshort(m.series.anchorDate)}` : SUB[state.tab];
  $('#banner').innerHTML = m.source !== 'live' && m.totals.calls && r.kind !== 'designer' ? `<div class="banner">${m.source === 'seed' ? 'Showing TEST data only.' : 'This view includes test and simulated calls — switch to “Live” for real traffic.'}</div>` : '';
  $('#foot').textContent = r.kind === 'admin' ? 'Cost figures use unit prices marked ESTIMATE in config.yaml. Test data is never sent to HubSpot or Telegram. Refreshes every 15 s.' : 'Refreshes every 15 s.';
  const views = { overview: vOverview, leads: vLeads, schedule: vSchedule, spotcheck: vSpot, health: vHealth };
  const app = $('#app'); app.classList.remove('busy');
  app.innerHTML = views[state.tab](m);
  document.querySelectorAll('details').forEach((d) => { if (open.includes(d.dataset.key)) d.open = true; });
  if (state.drawer) { if (!$('#drawer').contains(document.activeElement)) renderDrawer(); drawOpenRow(); }
}

async function load(force = false) {
  if (location.protocol === 'file:') { $('#app').innerHTML = '<div class="banner">This page needs the dashboard server — it cannot run from a file. In a terminal in the project folder run <code>npm run demo</code> then <code>npm run dashboard -- --dir data/demo</code>, and open <b>http://127.0.0.1:4177</b>.</div>'; return; }
  try {
    const app = $('#app'); if (state.m && force) app.classList.add('busy');
    const r = await fetch('/api/metrics?source=' + state.src);
    if (!r.ok) throw new Error(r.status === 401 ? 'login required' : 'HTTP ' + r.status);
    const m = await r.json();
    // Don't redraw under someone who is mid-way through changing a dropdown or typing.
    const ae = document.activeElement;
    if (!force && state.m && ae && app.contains(ae) && /^(SELECT|INPUT|TEXTAREA)$/.test(ae.tagName)) { state.m = m; return; }
    render(m);
  } catch (e) { console.error(e); const app = $('#app'); app.classList.remove('busy'); if (!app.querySelector('.card, .kpi')) app.innerHTML = `<div class="banner">Could not load or draw the dashboard: ${esc(e.message)}. If you just updated the code, restart the dashboard server.</div>`; }
}

/* ---------- events ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab],[data-src],[data-range],[data-toggle],[data-review],[data-open],[data-close],[data-scope],[data-ftier],[data-week],[data-desk],[data-owner],[data-export],[data-act],[data-copy]');
  if (e.target.closest('select')) return;
  if (!t) { if (e.target.id === 'backdrop') closeDrawer(); return; }
  const d = t.dataset;
  if (d.tab) { state.tab = d.tab; history.replaceState(null, '', location.pathname + location.search + '#' + state.tab); render(state.m); window.scrollTo({ top: 0 }); }
  else if (d.src) { state.src = d.src; document.querySelectorAll('#srcseg button').forEach((x) => x.setAttribute('aria-pressed', String(x === t))); load(true); }
  else if (d.range !== undefined) { state.range = Number(d.range); render(state.m); }
  else if (d.toggle) { state.tables[d.toggle] = d.mode === 'table'; render(state.m); }
  else if (d.review) { const r = await postJson('/api/review', { enquiryId: d.id, verdict: d.review }); if (!r.ok) toast('Could not save the review', true); load(true); }
  else if (d.open) openDrawer(d.open, d.focus);
  else if (t.hasAttribute('data-close')) closeDrawer();
  else if (d.scope) { state.f.scope = d.scope; render(state.m); }
  else if (d.ftier) { state.f.tier = d.ftier; render(state.m); }
  else if (d.week !== undefined) { state.week = d.week === '0' ? 0 : state.week + Number(d.week); render(state.m); }
  else if (d.desk) { state.deskFilter = d.desk; render(state.m); }
  else if (d.owner) { state.f = { scope: 'open', tier: 'all', stage: 'all', owner: d.owner }; state.tab = 'leads'; render(state.m); }
  else if (t.hasAttribute('data-export')) exportCsv();
  else if (d.copy !== undefined) { try { await navigator.clipboard.writeText(d.copy); toast('Number copied'); } catch { toast('Copy is blocked in this browser', true); } }
  else if (d.act === 'cancel_consult') { if (confirm('Cancel this consultation? The designer group is told on Telegram.')) { const r = await act({ action: 'cancel_consult', enquiryId: d.id }); if (r.ok) toast('Consultation cancelled'); } }
  else if (d.act === 'auto_assign_all') { const r = await act({ action: 'auto_assign_all' }); if (r.ok) toast('Unassigned leads shared out'); }
  else if (d.act === 'stage') { const r = await act({ action: 'stage', stage: d.stage, enquiryId: d.id }); if (r.ok) toast('Marked as ' + STAGE[d.stage][0].toLowerCase()); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('#tip').classList.remove('on'); if (state.drawer) closeDrawer(); }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Enter' && e.target.matches?.('tr.lead-row')) openDrawer(e.target.dataset.open);
});
document.addEventListener('change', async (e) => {
  const t = e.target, d = t.dataset;
  if (d.assign !== undefined) {
    const prev = getLead(d.assign)?.ownerName; const to = t.options[t.selectedIndex]?.text;
    const r = await act({ action: 'assign', enquiryId: d.assign, ownerId: t.value });
    if (r.ok) toast(prev ? `Reassigned to ${to}` : `Assigned to ${to}`);
  } else if (d.stage !== undefined && t.matches('select')) {
    const r = await act({ action: 'stage', enquiryId: d.stage, stage: t.value }); if (r.ok) toast('Stage updated');
  } else if (d.fstage !== undefined) { state.f.stage = t.value; render(state.m); }
  else if (d.fowner !== undefined) { state.f.owner = t.value; render(state.m); }
  else if (t.id === 'role') {
    state.role = t.value; try { localStorage.setItem('aangan-role', state.role); } catch { /* ignore */ }
    const u = new URL(location.href); u.searchParams.set('as', state.role); history.replaceState(null, '', u);
    state.f = { scope: 'open', tier: 'all', stage: 'all', owner: 'all' }; state.deskFilter = 'all'; closeDrawer(); render(state.m);
  }
});
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const id = f.dataset.id, v = Object.fromEntries(new FormData(f));
  if (f.dataset.form === 'note') { const r = await act({ action: 'note', enquiryId: id, text: v.text }); if (r.ok) toast('Note added'); }
  else if (f.dataset.form === 'schedule') {
    const start = new Date(`${v.date}T${v.time}:00${state.m.team.tzOffset}`);
    if (Number.isNaN(start.getTime())) { toast('Pick a valid date and time', true); return; }
    const r = await act({ action: 'schedule', enquiryId: id, start: start.toISOString(), minutes: Number(v.minutes), designerId: v.designerId });
    if (r.ok) toast('Consultation booked — add it to Google Calendar below');
  }
});
$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim(); if (state.m) { if (state.tab !== 'leads') { state.tab = 'leads'; history.replaceState(null, '', location.pathname + location.search + '#leads'); } render(state.m); } });
const tip = $('#tip');
function showTip(el, x, y) {
  let d; try { d = JSON.parse(el.getAttribute('data-tip')); } catch { return; }
  tip.innerHTML = `<b>${esc(d.t)}</b>` + d.r.map((r) => `<div class="r">${r.c ? `<i class="sw" style="background:${r.c}"></i>` : ''}<span>${esc(r.k)}</span><span style="margin-left:auto;padding-left:12px"><b style="display:inline">${esc(r.v)}</b></span></div>`).join('');
  tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + 'px';
  tip.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y - h - 10)) + 'px';
}
document.addEventListener('mousemove', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('on'); });
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } });
document.addEventListener('focusout', () => tip.classList.remove('on'));

/* theme */
const themeBtn = $('#theme');
function setTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); const dark = (document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark'; themeBtn.innerHTML = svg(dark ? 'sun' : 'moon'); }
try { const saved = localStorage.getItem('aangan-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch { /* storage unavailable: follow the OS */ }
setTheme();
themeBtn.addEventListener('click', () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const next = cur === 'dark' ? 'light' : 'dark'; setTheme(next); try { localStorage.setItem('aangan-theme', next); } catch { /* ignore */ } });
window.addEventListener('hashchange', () => { state.tab = (location.hash || '#overview').slice(1); if (state.m) render(state.m); });

load(true);
setInterval(() => load(false), 15000);
</script>
